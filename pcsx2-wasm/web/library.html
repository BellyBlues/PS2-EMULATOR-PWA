<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121110">
<meta name="description" content="TabStationToo's disc library: your disc images on a shelf, and a PS2 to put them in.">
<title>Disc library · TabStationToo</title>
<!-- The disc library on its own, for working on it without the emulator: the same component as the
     player's "Disc library" (library/disc-library.js), where the insert only rehearses the boot.
     library-3d.html is the first, 3D take. The page reads the start of each disc image in the chosen
     folder to name it; nothing is uploaded. It fetches disc art from one other origin
     (library/folder.js), which the owner allowed for the library. -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="library/ps2.webp" as="image">
<link rel="stylesheet" href="library/page.css">
<link rel="stylesheet" href="library/disc-library.css">
<script type="module">
import { createDiscLibrary } from './library/disc-library.js';
const params = new URLSearchParams(location.search);
const lib = createDiscLibrary(document.getElementById('library'), { demo: params.has('demo') });
// ?tray=open opens the tray, for checking the cut-out against the photo.
if (params.get('tray') === 'open')
	lib.openTray();
</script>
</head>
<body>

<header class="marquee">
  <h1 class="wordmark"><svg class="mark" aria-hidden="true" focusable="false"><use href="icons.svg#i-mark"/></svg><span class="wm">TabStation<span class="wm-too">Too</span></span><span class="wm-page">Disc library</span></h1>
</header>

<main class="lib" id="library"></main>

<footer class="credits">Built on PCSX2 (GPL-3.0) <span class="sep">·</span> Not affiliated with Sony or the PCSX2 project <span class="sep">·</span> Console photo: Evan-Amos, public domain <span class="sep">·</span> Disc art: <a href="https://github.com/xlenore/ps2-covers" target="_blank" rel="noopener noreferrer">ps2-covers<span class="vh"> (opens in a new tab)</span></a></footer>
</body>
</html>
